# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: dnf
    repos:
      copr:
        - scottames/ghostty
    install:
      # CLIs de ciclo rápido (bat, fd, fzf, zoxide, fastfetch, starship) ficam no
      # Homebrew do usuário: ver homebrew/Brewfile e docs/empacotamento.md
      packages:
        - zsh
        - make
        - ripgrep
        - jq
        - git-delta
        - tree
        - unzip
        - chafa
        - libsixel
        - tmux
        - btop
