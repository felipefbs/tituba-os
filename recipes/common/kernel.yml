# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# swaps the stock kernel for Bazzite's "ogc" kernel, same as ghcr.io/ublue-os/bazzite
modules:
  - type: akmods
    base: ogc # if not specified, classic "main" base is used by default
    install:
      - v4l2loopback
      - xone
