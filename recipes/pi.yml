---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: tituba-os-pi
description: Raspberry Pi 4 sem interface gráfica, host de containers (pihole, octoprint, traefik...).

# as imagens ublue são só amd64; o Fedora IoT publica arm64 e suporta o Pi 4.
# Não existe tag "latest" acompanhando a ublue: atualizar a versão a cada Fedora.
base-image: quay.io/fedora/fedora-iot
image-version: 44

modules:
  - type: files
    files:
      - source: system
        destination: /

  # o módulo dnf do BlueBuild exige dnf5, que a base IoT pode não trazer
  - type: script
    snippets:
      - command -v dnf5 >/dev/null || rpm-ostree install dnf5

  - from-file: common/core.yml
  - from-file: common/cli.yml
  - from-file: common/docker.yml
  - from-file: common/server.yml
  - from-file: common/dns-host.yml

  - type: signing
